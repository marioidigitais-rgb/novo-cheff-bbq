// Busca o cardápio (categorias, produtos, adicionais, bairros, formas de

async function loadMenuFromSupabase(){
 try{
  const [catsR,prodR,paR,addonsR,nbR,payR,hoursR,tablesR,setR]=await Promise.all([
   sb.from('categories').select('id,name,sort_order').order('sort_order'),

   sb.from('addons').select('id,name,price,stock,active,min_qty,max_qty'),
   sb.from('neighborhoods').select('id,name,fee,municipio,active'),
   sb.from('payment_methods').select('id,name,fee,active,show_client'),
   sb.from('business_hours').select('weekday,open_time,close_time,active'),
   sb.from('restaurant_tables').select('id,name'),
   sb.from('settings').select('*').eq('id',1).maybeSingle()
  ]);
  if(catsR.error)throw catsR.error;
  if(prodR.error)throw prodR.error;
  if(nbR.error)throw nbR.error;
  db.categories=(catsR.data||[]).map(c=>({id:c.id,name:c.name}));
  const paMap={};
  (paR.data||[]).forEach(x=>{(paMap[x.product_id]=paMap[x.product_id]||[]).push({id:x.addon_id,max:x.max_qty})});
  db.products=(prodR.data||[]).map(p=>({id:p.id,cat:p.category_id,name:p.name,desc:p.description||'',price:Number(p.price),oldPrice:Number(p.old_price)||0,stock:Number(p.stock),active:p.active,showStock:p.show_stock,type:p.type==='pi'?'pi':'pa',addons:paMap[p.id]||[],recipe:[],photo:p.photo||null}));
  db.addons=(addonsR.data||[]).map(a=>({id:a.id,name:a.name,price:Number(a.price),stock:Number(a.stock),active:a.active,min:a.min_qty,max:a.max_qty}));
  db.neighborhoods=(nbR.data||[]).map(n=>({id:n.id,name:n.name,fee:Number(n.fee),municipio:n.municipio||'',active:n.active!==false}));
  db.payments=(payR.data||[]).map(p=>({id:p.id,name:p.name,fee:Number(p.fee),active:p.active,showClient:p.show_client}));
  const hoursObj={};(hoursR.data||[]).forEach(h=>{hoursObj[h.weekday]={open:(h.open_time||'').slice(0,5),close:(h.close_time||'').slice(0,5),active:h.active}});
  if(Object.keys(hoursObj).length)db.hours=hoursObj;

  if(setR.data){const s=setR.data;db.settings={adminWhatsApp:s.admin_whatsapp||'',storeName:s.store_name||'Novo Cheff BBQ',print:{font:s.print_font||'14px monospace',paper:s.print_paper||'80mm',order:s.print_order||'produto,adicionais,cliente,endereco,pagamento,total',estimatedTime:s.estimated_time||'30 a 45 minutos'},messages:{saudacao:s.msg_saudacao||'',retirada:s.msg_retirada||'',entrega:s.msg_entrega||'',mesa:s.msg_mesa||'',encerramento:s.msg_encerramento||'',fechado:s.msg_fechado||''}}}

// Envia o pedido (do cliente ou do PDV) pro Supabase — cliente, endereço,
// pedido, itens, adicionais e forma(s) de pagamento. Usa upsert, então
// tanto cria o pedido quanto atualiza um pedido que já existia lá (status,
// pagamento, itens etc). Roda depois que o pedido já foi salvo e impresso
// localmente — se der algum problema de rede, o pedido não é perdido nem
// travado por causa disso; ele fica marcado como pendente e é reenviado
// na próxima sincronização (ver syncAllToSupabase).
async function saveOrderToSupabase(o){
 let customerRow=null;
 if(o.customer.phone){
  const existing=await sb.from('customers').select('id').eq('phone',o.customer.phone).maybeSingle();
  if(existing.data){
   customerRow=existing.data;
   await sb.from('customers').update({name:o.customer.name}).eq('id',customerRow.id);
  }else{
   const ins=await sb.from('customers').insert({name:o.customer.name,phone:o.customer.phone}).select('id').single();
   if(ins.error)throw ins.error;
   customerRow=ins.data;
  }
 }
 if(o.customer.delivery==='entrega'&&customerRow){
  const addrIns=await sb.from('customer_addresses').insert({customer_id:customerRow.id,label:'Endereço',street:o.customer.address,number:o.customer.number,complement:o.customer.complement||'',neighborhood_id:o.customer.neighborhood||null,neighborhood_name:o.customer.neighborhoodName||''});
  if(addrIns.error)console.error('Não foi possível salvar o endereço do pedido '+o.id+' no Supabase:',addrIns.error);
 }
 const subtotal=o.items.reduce((s,x)=>s+x.price*x.qty+(x.addons||[]).reduce((a,b)=>a+b.price*b.qty*x.qty,0),0);
 const orderRow={id:o.id,source:o.source||'online',status:o.status,customer_id:customerRow?.id||null,customer_name:o.customer.name,customer_phone:o.customer.phone||'',delivery_type:o.customer.delivery,table_name:o.customer.table||'',address:o.customer.address||'',number:o.customer.number||'',complement:o.customer.complement||'',neighborhood_id:o.customer.neighborhood||null,neighborhood_name:o.customer.neighborhoodName||'',delivery_fee:o.customer.deliveryFee||0,notes:o.customer.notes||'',subtotal,total:o.total,paid:!!o.paid};
 const orderUp=await sb.from('orders').upsert(orderRow);
 if(orderUp.error)throw orderUp.error;
 const payDel=await sb.from('order_payments').delete().eq('order_id',o.id);
 if(payDel.error)throw payDel.error;
 const payRows=(o.customer.payments?.length?o.customer.payments:[{payment:o.customer.payment,amount:o.total}]).filter(p=>p.payment).map(p=>({order_id:o.id,payment_method_id:p.payment,amount:p.amount}));
 if(payRows.length){const payIns=await sb.from('order_payments').insert(payRows);if(payIns.error)throw payIns.error;}
 const oldItems=await sb.from('order_items').select('id').eq('order_id',o.id);
 if(oldItems.error)throw oldItems.error;
 const oldItemIds=(oldItems.data||[]).map(x=>x.id);
 if(oldItemIds.length){
  const delAddons=await sb.from('order_item_addons').delete().in('order_item_id',oldItemIds);
  if(delAddons.error)throw delAddons.error;
 }
 const itemsDel=await sb.from('order_items').delete().eq('order_id',o.id);
 if(itemsDel.error)throw itemsDel.error;
 for(const item of o.items){
  const itemIns=await sb.from('order_items').insert({order_id:o.id,product_id:item.productId,product_name:item.name,unit_price:item.price,qty:item.qty,notes:item.notes||''}).select('id').single();
  if(itemIns.error)throw itemIns.error;
  const addonRows=(item.addons||[]).map(a=>({order_item_id:itemIns.data.id,addon_id:a.id,addon_name:a.name,unit_price:a.price,qty:a.qty}));
  if(addonRows.length){const addonIns=await sb.from('order_item_addons').insert(addonRows);if(addonIns.error)throw addonIns.error;}
 }
 __snapCommit('order:'+o.id,o);
}

// ================= SINCRONIZAÇÃO COMPLETA COM O SUPABASE =================
// Tudo que o painel administrativo altera (cardápio, estoque, bairros,
// formas de pagamento, horários, mesas, configurações da loja e pedidos)
// passa por aqui. A cada save() local, comparamos o estado atual com o
// último estado que realmente foi confirmado no Supabase e mandamos só o
// que mudou — assim outros aparelhos (outro celular no balcão, o próprio
// cardápio do cliente) enxergam a mudança sem precisar editar tudo de novo.
// Se uma parte falhar (sem internet, por exemplo), ela continua marcada
// como "não sincronizada" e é reenviada na próxima tentativa — nada fica
// perdido, só atrasado.
window.__syncSnap=window.__syncSnap||{};
function __snapEquals(key,val){return window.__syncSnap[key]===JSON.stringify(val)}
function __snapCommit(key,val){window.__syncSnap[key]=JSON.stringify(val)}
function __seedSyncSnapshot(){
 // Chamado assim que o cardápio é lido do Supabase com sucesso: marca o
 // estado atual como "já sincronizado" pra não reenviar de volta pro
 // Supabase o que acabou de vir de lá.
 __snapCommit('categories',db.categories);
 __snapCommit('products',db.products);
 __snapCommit('addons',db.addons);
 __snapCommit('neighborhoods',db.neighborhoods);
 __snapCommit('payments',db.payments);
 __snapCommit('hours',db.hours);
 __snapCommit('tables',db.tables);
 __snapCommit('settings',db.settings);
 (db.orders||[]).forEach(o=>__snapCommit('order:'+o.id,o));
}
// Upsert de uma tabela inteira + apaga do Supabase o que não existe mais
// localmente (ex: categoria excluída no painel). idField é a coluna chave.
async function __upsertAndPrune(table,rows,idField){
 idField=idField||'id';
 if(rows.length){
  const r=await sb.from(table).upsert(rows);
  if(r.error)throw r.error;
 }
 const cur=await sb.from(table).select(idField);
 if(cur.error)throw cur.error;
 const keep=new Set(rows.map(x=>x[idField]));
 const toDelete=(cur.data||[]).map(x=>x[idField]).filter(x=>!keep.has(x));
 if(toDelete.length){
  const del=await sb.from(table).delete().in(idField,toDelete);
  if(del.error)throw del.error;
 }
}
async function syncCategoriesToSupabase(){
 if(__snapEquals('categories',db.categories))return;
 const rows=db.categories.map((c,i)=>({id:c.id,name:c.name,sort_order:i}));
 await __upsertAndPrune('categories',rows);
 __snapCommit('categories',db.categories);
}
async function syncAddonsToSupabase(){
 if(__snapEquals('addons',db.addons))return;
 const rows=db.addons.map(a=>({id:a.id,name:a.name,price:a.price,stock:a.stock,active:a.active,min_qty:a.min,max_qty:a.max}));
 await __upsertAndPrune('addons',rows);
 __snapCommit('addons',db.addons);
}
async function syncProductsToSupabase(){
 if(__snapEquals('products',db.products))return;
 const rows=db.products.map(p=>({id:p.id,category_id:p.cat,name:p.name,description:p.desc,price:p.price,old_price:p.oldPrice,stock:p.stock,active:p.active,show_stock:p.showStock,type:p.type,photo:p.photo||null}));
 await __upsertAndPrune('products',rows);
 // a relação produto × adicional é sempre derivada do que está nos
 // produtos agora, então é mais simples apagar tudo e recriar do zero.
 const delPA=await sb.from('product_addons').delete().not('product_id','is',null);
 if(delPA.error)throw delPA.error;
 const paRows=[];
 db.products.forEach(p=>(p.addons||[]).forEach(a=>paRows.push({product_id:p.id,addon_id:a.id,max_qty:a.max})));
 if(paRows.length){const insPA=await sb.from('product_addons').insert(paRows);if(insPA.error)throw insPA.error;}
 __snapCommit('products',db.products);
}

// Escuta mudanças feitas por OUTROS aparelhos direto no Supabase (outro
// celular no balcão, outra aba do painel) e atualiza a tela na hora,
// sem precisar recarregar a página. Fica um pouco "atrasado" de propósito
// (900ms) pra não brigar com uma sincronização local que acabou de sair.
let __realtimeReloadTimer=null;
function __scheduleRealtimeReload(){
 clearTimeout(__realtimeReloadTimer);
 __realtimeReloadTimer=setTimeout(async()=>{
  await loadMenuFromSupabase();
  if(window.supabaseMenuLoaded){normalize();__seedSyncSnapshot();render()}
 },900);
}
function startSupabaseRealtime(){
 try{
  sb.channel('cardapio-mudou')
   .on('postgres_changes',{event:'*',schema:'public',table:'products'},__scheduleRealtimeReload)
   .on('postgres_changes',{event:'*',schema:'public',table:'categories'},__scheduleRealtimeReload)
   .on('postgres_changes',{event:'*',schema:'public',table:'addons'},__scheduleRealtimeReload)
   .on('postgres_changes',{event:'*',schema:'public',table:'neighborhoods'},__scheduleRealtimeReload)
   .on('postgres_changes',{event:'*',schema:'public',table:'payment_methods'},__scheduleRealtimeReload)
   .on('postgres_changes',{event:'*',schema:'public',table:'settings'},__scheduleRealtimeReload)
   .subscribe();
  sb.channel('pedidos-mudou')
   .on('postgres_changes',{event:'*',schema:'public',table:'orders'},payload=>{
    // Se o pedido já existir localmente, não sobrescreve o carrinho/itens
    // (que só o dono do pedido tem em memória) — só avisa que algo mudou
    // no Supabase; quem precisa dos detalhes completos é o painel admin,
    // que já lê os pedidos do localStorage/armazenamento local.
    if(route==='admin'&&adminAuth)playBell();
   })
   .subscribe();
 }catch(e){console.error('Não foi possível ativar a atualização em tempo real do Supabase:',e)}
}

function safeDate(v){const d=new Date(v);return isNaN(d.getTime())?null:d}
function isoDay(v){const d=safeDate(v);return d?d.toISOString().slice(0,10):''}

function categoryAllowsAddons(catId){const c=db.categories.find(x=>x.id===catId);if(!c)return false;const n=normStr(c.name);return n.includes('churrasco')||n.includes('hamburgu')}

 try{

function productHasRecipe(p){return !!(p&&Array.isArray(p.recipe)&&p.recipe.length>0)}
function productTypeLabel(p){return p&&p.type==='pi'?'🧾 PI':'🍔 PA'}
function productRecipeIncludesPi(pid,targetPid,seen){
 seen=seen||new Set();
 if(seen.has(pid))return false;
 seen.add(pid);
 const p=db.products.find(x=>x.id===pid);
 if(!p||!Array.isArray(p.recipe))return false;
 for(const r of p.recipe){
  if(r.kind==='pi'&&r.productId){
   if(r.productId===targetPid)return true;
   if(productRecipeIncludesPi(r.productId,targetPid,seen))return true;
  }
 }
 return false;
}

function productUnitCost(p){
 try{
  if(!p)return 0;
  if(productHasRecipe(p)){
   return p.recipe.reduce((total,r)=>{
    const qty=Number(r.qty)||0;
    if(r.kind==='pi'){
     const sub=db.products.find(x=>x.id===r.productId);
     return total+(sub?productUnitCost(sub)*qty:0);
    }
    const ing=db.ingredients.find(i=>i.id===r.ingredientId);
    return total+(ing?(Number(ing.cost)||0)*qty:0);
   },0);
  }
  return productAvgCost(p.id);
 }catch(e){
  console.error('Erro ao calcular custo do produto:',e);
  return 0;
 }
}
function productAvgCost(pid){
 try{
  const movs=(db.stockMovements||[]).filter(m=>m.productId===pid&&m.type==='entrada').slice().sort((a,b)=>new Date(b.date)-new Date(a.date)).slice(0,3);
  if(!movs.length)return 0;
  return movs.reduce((s,m)=>s+(Number(m.unitPrice)||0),0)/movs.length;
 }catch(e){
  console.error('Erro ao calcular custo médio do produto:',e);
  return 0;
 }
}
function getProductStock(p){
 try{
  if(!p)return 0;
  if(!productHasRecipe(p))return Math.max(0,Number(p.stock)||0);
  let min=Infinity;
  for(const r of p.recipe){
   const qty=Number(r.qty)||0;
   if(qty<=0)return 0;
   if(r.kind==='pi'){
    const sub=db.products.find(x=>x.id===r.productId);
    if(!sub||!sub.active)return 0;
    min=Math.min(min,Math.floor(getProductStock(sub)/qty));
   }else{
    const ing=db.ingredients.find(i=>i.id===r.ingredientId);
    if(!ing||!ing.active)return 0;
    min=Math.min(min,Math.floor(getIngredientAvailable(ing.id)/qty));
   }
  }
  return Number.isFinite(min)?Math.max(0,min):0;
 }catch(e){
  console.error('Erro ao calcular estoque do produto:',e);
  return 0;
 }
}
function consumeProductStock(p,qty,meta){
 if(!p||!(qty>0))return;
 meta=meta||{};
 const orderId=meta.orderId||'';
 const now=new Date().toISOString();
 if(productHasRecipe(p)){
  p.recipe.forEach(r=>{
   const usedQty=(Number(r.qty)||0)*qty;
   if(r.kind==='pi'){
    const sub=db.products.find(x=>x.id===r.productId);if(!sub)return;
    consumeProductStock(sub,usedQty,meta);
    return;
   }
   const ing=db.ingredients.find(i=>i.id===r.ingredientId);if(!ing)return;
   ing.stock=Math.max(0,(Number(ing.stock)||0)-usedQty);
   db.materiaMovements=db.materiaMovements||[];
   db.materiaMovements.push({id:id('mmov'),type:'saida',date:now,ingredientId:ing.id,ingredientName:ing.name,unit:ing.unit,qty:usedQty,unitPrice:Number(ing.cost)||0,reason:'pedido',document:orderId,note:''});
  });
 }else{
  p.stock=Math.max(0,(Number(p.stock)||0)-qty);
  db.stockMovements=db.stockMovements||[];
  db.stockMovements.push({id:id('mov'),type:'saida',date:now,productId:p.id,productName:p.name,unit:'un',qty,unitPrice:0,reason:'pedido',document:orderId,note:''});
 }
}
function restoreProductStock(p,qty,meta){
 if(!p||!(qty>0))return;
 meta=meta||{};
 const orderId=meta.orderId||'';
 const now=new Date().toISOString();
 if(productHasRecipe(p)){
  p.recipe.forEach(r=>{
   const restoredQty=(Number(r.qty)||0)*qty;
   if(r.kind==='pi'){
    const sub=db.products.find(x=>x.id===r.productId);if(!sub)return;
    restoreProductStock(sub,restoredQty,meta);
    return;
   }
   const ing=db.ingredients.find(i=>i.id===r.ingredientId);if(!ing)return;
   ing.stock=(Number(ing.stock)||0)+restoredQty;
   db.materiaMovements=db.materiaMovements||[];
   db.materiaMovements.push({id:id('mmov'),type:'entrada',date:now,ingredientId:ing.id,ingredientName:ing.name,unit:ing.unit,qty:restoredQty,unitPrice:Number(ing.cost)||0,reason:'estorno',document:orderId,note:'Estorno de pedido'});
  });
 }else{
  p.stock=(Number(p.stock)||0)+qty;
  db.stockMovements=db.stockMovements||[];
  db.stockMovements.push({id:id('mov'),type:'entrada',date:now,productId:p.id,productName:p.name,unit:'un',qty,unitPrice:0,reason:'estorno',document:orderId,note:'Estorno de pedido'});
 }
}

function payDialogCalc(){
 const o=db.orders.find(x=>x.id===window.paymentDialogOrderId);const d=window.paymentDialogDraft||{};
 if(!o)return {toPay:0,paidSum:0,remaining:0,percentValue:0,itemsBase:0,deliveryFee:0};
 const itemsBase=o.items.reduce((s,x)=>s+x.price*x.qty+(x.addons||[]).reduce((a,b)=>a+b.price*b.qty*x.qty,0),0);
 const deliveryFee=Number(o.customer.deliveryFee||0);
 const percentValue=+(itemsBase*(Number(d.percent||0)/100)).toFixed(2);
 const toPay=Math.max(0,+(itemsBase+deliveryFee+percentValue+Number(d.surcharge||0)-Number(d.discount||0)).toFixed(2));
 const paidSum=+(d.lines||[]).reduce((s,l)=>s+Number(l.amount||0),0).toFixed(2);
 const remaining=Math.max(0,+(toPay-paidSum).toFixed(2));
 return {toPay,paidSum,remaining,percentValue,itemsBase,deliveryFee};

function orderRemoveOneItem(orderId,pid){
 const o=db.orders.find(x=>x.id===orderId);if(!o)return;
 const items=o.items;
 for(let i=items.length-1;i>=0;i--){
  if(items[i].productId===pid){
   const it=items[i];
   const p=db.products.find(x=>x.id===pid);
   if(it.qty>1){
    it.qty--;
    if(p)restoreProductStock(p,1,{orderId:o.id});
   }else{
    if(p)restoreProductStock(p,it.qty,{orderId:o.id});
    (it.addons||[]).forEach(a=>{const ad=db.addons.find(q=>q.id===a.id);if(ad)ad.stock+=a.qty});
    items.splice(i,1);
   }
   recalcOrderTotal(o);
   save();
   return;
  }
 }
}

function downloadProductTemplate(){
 if(typeof XLSX==='undefined'){alert('Não foi possível carregar a biblioteca de planilhas. Verifique sua conexão com a internet e tente novamente.');return}
 const rows=[['Categoria','Nome','Preço','Estoque','Descrição','Exibir estoque','Tipo'],['Hambúrgueres','Cheeseburger Duplo','29.90','20','Pão brioche, dois blends e queijo','Não','PA']];
 const ws=XLSX.utils.aoa_to_sheet(rows),wb=XLSX.utils.book_new();
 XLSX.utils.book_append_sheet(wb,ws,'Produtos');
 XLSX.writeFile(wb,'modelo-produtos.xlsx');
}
function parseMoneyCell(v){
 if(typeof v==='number')return v;
 let s=String(v??'').trim().replace(/[^\d,.-]/g,'');
 if(s.includes(',')&&s.includes('.'))s=s.replace(/\./g,'').replace(',','.');
 else if(s.includes(','))s=s.replace(',','.');
 return Number(s)||0;
}
function findOrCreateCategoryByName(name){
 name=String(name||'').trim();if(!name)return null;
 let c=db.categories.find(x=>x.name.toLowerCase()===name.toLowerCase());
 if(!c){c={id:id('cat'),name};db.categories.push(c)}
 return c;
}
function normalizeProductName(s){return String(s||'').trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'')}
function findExistingProductByNameCat(name,catId){return db.products.find(p=>p.cat===catId&&normalizeProductName(p.name)===normalizeProductName(name))}
function importProductsFromSheet(file){
 if(typeof XLSX==='undefined'){window.importMsg='Não foi possível carregar a biblioteca de planilhas. Verifique sua conexão com a internet.';window.importMsgType='err';render();return}
 const reader=new FileReader();
 reader.onload=(e)=>{
  try{
   const wb=XLSX.read(e.target.result,{type:'array'});
   const sheet=wb.Sheets[wb.SheetNames[0]];
   const rows=XLSX.utils.sheet_to_json(sheet,{defval:''});
   let added=0,updated=0,skipped=0;
   rows.forEach(r=>{
    const keyMap=Object.keys(r).reduce((acc,k)=>{acc[k.trim().toLowerCase()]=r[k];return acc},{});
    const name=String(keyMap['nome']||keyMap['produto']||'').trim();
    const catName=String(keyMap['categoria']||keyMap['grupo']||'').trim();
    const price=parseMoneyCell(keyMap['preço']||keyMap['preco']||keyMap['valor']);
    const stock=Math.max(0,Math.round(Number(keyMap['estoque']||0)));
    const desc=String(keyMap['descrição']||keyMap['descricao']||'').trim();
    const showStockRaw=String(keyMap['exibir estoque']||keyMap['mostrar estoque']||'').trim().toLowerCase();
    const showStock=['sim','s','true','1','yes'].includes(showStockRaw);
    const typeRaw=String(keyMap['tipo']||'').trim().toLowerCase();
    const type=['pi','produto intermediário','produto intermediario'].includes(typeRaw)?'pi':'pa';
    if(!name||!(price>0)||!catName){skipped++;return}
    const cat=findOrCreateCategoryByName(catName);
    const existing=findExistingProductByNameCat(name,cat.id);
    if(existing){
     existing.name=name;existing.desc=desc;existing.price=price;existing.stock=stock;existing.type=type;existing.showStock=showStock;
     updated++;
    }else{
     db.products.push({id:id('p'),cat:cat.id,name,desc,price,stock,type,active:true,showStock,addons:[]});
     added++;
    }
   });
   save();

 const stockProdItem=p=>{const st=getProductStock(p),hasR=productHasRecipe(p);return `<div class="itemrow"><div class="row"><b>${esc(p.name)}</b>${unlocked&&!hasR?`<input autocomplete="off" data-editstock="product|${p.id}" type="number" min="0" value="${st}" style="width:90px;text-align:right;background:var(--bg);color:var(--cream);border:1px solid var(--line);border-radius:6px;padding:6px">`:`<span class="${st?'price':'sold'}">${st}${hasR?' 🧾':''}</span>`}</div><div class="meta">${hasR?'Calculado pela receita (matérias-primas) · edite o estoque em Matérias-primas':st===0?'PRODUTO ESGOTADO — cliente não pode selecionar.':'Disponível'}</div></div>`};
 let html=`<div class="settings-list">${db.categories.map(c=>{const catProds=db.products.filter(p=>p.cat===c.id);const open=(window.stockCatOpen||{})[c.id]?' open':'';return `<details data-stockcat="${c.id}"${open}><summary>${esc(c.name)} <span class="tag" style="margin-left:6px">${catProds.length} produto${catProds.length===1?'':'s'}</span></summary><div class="settings-content">${catProds.map(stockProdItem).join('')||'<p class="meta">Nenhum produto nesta categoria.</p>'}</div></details>`}).join('')}</div>`;
 const uncategorized=db.products.filter(p=>!db.categories.some(c=>c.id===p.cat));
 if(uncategorized.length){const open=(window.stockCatOpen||{}).__uncat?' open':'';html+=`<div class="settings-list"><details data-stockcat="__uncat"${open}><summary>Sem categoria <span class="tag" style="margin-left:6px">${uncategorized.length} produto${uncategorized.length===1?'':'s'}</span></summary><div class="settings-content">${uncategorized.map(stockProdItem).join('')}</div></details></div>`}
 return html;
}
function moveCategoryOrder(cid,dir){
 const idx=db.categories.findIndex(c=>c.id===cid);if(idx<0)return;
 const swap=dir==='up'?idx-1:idx+1;if(swap<0||swap>=db.categories.length)return;
 [db.categories[idx],db.categories[swap]]=[db.categories[swap],db.categories[idx]];save();
}
function moveProductOrder(pid,dir){
 const p=db.products.find(x=>x.id===pid);if(!p)return;
 const sameCat=db.products.map((x,i)=>({x,i})).filter(o=>o.x.cat===p.cat);
 const pos=sameCat.findIndex(o=>o.x.id===pid);const swapPos=dir==='up'?pos-1:pos+1;
 if(swapPos<0||swapPos>=sameCat.length)return;
 const iA=sameCat[pos].i,iB=sameCat[swapPos].i;
 [db.products[iA],db.products[iB]]=[db.products[iB],db.products[iA]];save();
}

function cashMethodName(mid){if(mid==='especie'||mid==='cash')return 'Espécie (Dinheiro)';if(mid==='pix')return 'Pix';return db.payments.find(p=>p.id===mid)?.name||(mid?mid:'—')}
function fmtDT(iso){if(!iso)return '—';try{const d=new Date(iso);if(isNaN(d))return '—';return d.toLocaleDateString('pt-BR')+' '+d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}catch(e){return '—'}}
function renderCash(){
 const today=new Date().toISOString().slice(0,10);
 window.cashReportFilter=window.cashReportFilter||{from:today,to:today};
 const rf=window.cashReportFilter;
 const allMov=(db.cash.movements||[]).map(m=>({...m,date:m.date||db.cash.openedAt||db.cash.closedAt||today,source:m.source||'manual',method:m.method||''}));
 const sessionMov=(db.cash.open&&db.cash.openedAt)?allMov.filter(m=>m.date>=db.cash.openedAt):[];
 const sIns=sessionMov.filter(m=>m.kind==='entrada').reduce((s,x)=>s+Number(x.value||0),0);
 const sOuts=sessionMov.filter(m=>m.kind==='saida').reduce((s,x)=>s+Number(x.value||0),0);
 const saldo=Number(db.cash.initial||0)+sIns-sOuts;
 const isEsp=m=>m.method==='especie'||m.method==='cash', isPix=m=>m.method==='pix';
 const espIn=sessionMov.filter(m=>m.kind==='entrada'&&isEsp(m)).reduce((s,x)=>s+Number(x.value||0),0);
 const espOut=sessionMov.filter(m=>m.kind==='saida'&&isEsp(m)).reduce((s,x)=>s+Number(x.value||0),0);
 const pxIn=sessionMov.filter(m=>m.kind==='entrada'&&isPix(m)).reduce((s,x)=>s+Number(x.value||0),0);
 const pxOut=sessionMov.filter(m=>m.kind==='saida'&&isPix(m)).reduce((s,x)=>s+Number(x.value||0),0);
 const inRange=m=>{const d=String(m.date).slice(0,10);return (!rf.from||d>=rf.from)&&(!rf.to||d<=rf.to)};
 const filtered=allMov.filter(inRange).sort((a,b)=>new Date(b.date)-new Date(a.date));
 const fIns=filtered.filter(m=>m.kind==='entrada').reduce((s,x)=>s+Number(x.value||0),0);
 const fOuts=filtered.filter(m=>m.kind==='saida').reduce((s,x)=>s+Number(x.value||0),0);
 return `<div class="cash-head"><h2>Caixa</h2><span class="cash-state ${db.cash.open?'state-open':'state-closed'}">${db.cash.open?'● Aberto':'● Fechado'}</span></div>
 ${db.cash.open&&db.cash.openedAt?`<div class="meta" style="margin-bottom:12px">Aberto em ${fmtDT(db.cash.openedAt)}</div>`:(db.cash.closedAt?`<div class="meta" style="margin-bottom:12px">Último fechamento: ${fmtDT(db.cash.closedAt)}</div>`:'<div class="meta" style="margin-bottom:12px">Caixa ainda não foi aberto.</div>')}
 <div class="metric metric-4"><div><span class="meta">Saldo inicial</span><b>${money(db.cash.initial)}</b></div><div><span class="meta">Entradas</span><b class="pos">${money(sIns)}</b></div><div><span class="meta">Saídas</span><b class="neg">${money(sOuts)}</b></div><div><span class="meta">Saldo atual</span><b>${money(saldo)}</b></div></div>
 ${db.cash.open?`<div class="cardbox cash-breakdown"><h3>Por forma de pagamento (sessão atual)</h3>
 <div class="itemrow"><span>💵 Espécie</span><b>${money(espIn-espOut)}</b></div><div class="meta" style="margin:-4px 0 10px 2px">Entradas ${money(espIn)} · Saídas ${money(espOut)}</div>
 <div class="itemrow"><span>📱 Pix</span><b>${money(pxIn-pxOut)}</b></div><div class="meta" style="margin:-4px 0 2px 2px">Entradas ${money(pxIn)} · Saídas ${money(pxOut)}</div></div>`:''}
 ${!db.cash.open?`<div class="cardbox"><h3>Abrir caixa</h3><div class="field"><label>Valor inicial</label><input autocomplete="off" id="cashInitial" type="number" step=".01" min="0" placeholder="0,00"></div><button class="primary" id="openCash">Abrir caixa</button></div>`
 :`<div class="cardbox"><h3>Movimentação manual</h3><div class="formgrid"><div class="field"><label>Tipo</label><select id="cashKind"><option value="entrada">Entrada (inserir dinheiro)</option><option value="saida">Saída (retirar dinheiro)</option></select></div><div class="field"><label>Forma de pagamento</label><select id="cashMethod"><option value="especie">Espécie (Dinheiro)</option><option value="pix">Pix</option></select></div></div><div class="field"><label>Valor</label><input autocomplete="off" id="cashValue" type="number" step=".01" min="0" placeholder="0,00"></div><div class="field"><label>Descrição (opcional)</label><input autocomplete="off" id="cashNote" placeholder="Ex.: Sangria, troco, reforço de caixa..."></div><button class="primary" id="addCashMove">Registrar movimentação</button><button class="ghost" id="closeCash">Fechar caixa</button></div>`}
 <div class="cardbox">
 <h3>Relatório de movimentações</h3>
 <div class="formgrid"><div class="field"><label>De</label><input id="cashRfFrom" type="date" value="${rf.from}"></div><div class="field"><label>Até</label><input id="cashRfTo" type="date" value="${rf.to}"></div></div>
 <div class="cash-quick-filters"><button type="button" class="btn" data-cashquick="hoje">Hoje</button><button type="button" class="btn" data-cashquick="7d">Últimos 7 dias</button><button type="button" class="btn" data-cashquick="30d">Últimos 30 dias</button></div>
 <button class="primary" id="applyCashReport">Aplicar filtro</button>
 <div class="metric cash-period-metric"><div><span class="meta">Entradas no período</span><b class="pos">${money(fIns)}</b></div><div><span class="meta">Saídas no período</span><b class="neg">${money(fOuts)}</b></div><div><span class="meta">Saldo do período</span><b>${money(fIns-fOuts)}</b></div></div>
 <div class="cash-table-wrap"><table class="table cash-table"><thead><tr><th>Data/Hora</th><th>Tipo</th><th>Movimento</th><th>Forma</th><th>Valor</th><th>Observação</th></tr></thead><tbody>
 ${filtered.map(m=>`<tr><td>${fmtDT(m.date)}</td><td><span class="tag ${m.source==='pedido'?'tag-pedido':'tag-interna'}">${m.source==='pedido'?'Pedido':'Movimentação interna'}</span></td><td><span class="mv-pill mv-${m.kind}">${m.kind==='entrada'?'Entrada':'Saída'}</span></td><td>${esc(cashMethodName(m.method))}</td><td class="${m.kind==='entrada'?'pos':'neg'}">${m.kind==='saida'?'- ':''}${money(m.value)}</td><td>${esc(m.source==='pedido'?('Pedido '+(m.orderId||'')+(m.note?' · '+m.note:'')):(m.note||'—'))}</td></tr>`).join('')||`<tr><td colspan="6" class="meta" style="text-align:center;padding:18px">Nenhuma movimentação no período selecionado.</td></tr>`}
 </tbody></table></div>
 </div>`
}

     <div class="addon-header">
      <div class="addon-info">
       <b class="addon-name">${esc(m.name)}</b>

function editOrder(orderId){
 const o=db.orders.find(x=>x.id===orderId);if(!o)return;
 const action=prompt('Digite ADICIONAR para incluir um produto, REMOVER para remover um item ou ADICIONAL para alterar adicionais.');
 if(!action)return;
 if(action.toLowerCase()==='remover'){
   const idx=Number(prompt('Número do item (1, 2, 3...)', '1'))-1;if(idx<0||idx>=o.items.length)return;
   const it=o.items[idx],p=db.products.find(x=>x.id===it.productId);if(p)restoreProductStock(p,it.qty,{orderId:o.id});(it.addons||[]).forEach(a=>{let ad=db.addons.find(x=>x.id===a.id);if(ad)ad.stock+=a.qty*it.qty});o.items.splice(idx,1);
 }else if(action.toLowerCase()==='adicionar'){
   const p=db.products.find(x=>x.id===prompt('ID do produto (consulte Produtos)', ''));if(!p||getProductStock(p)<1){alert('Produto não encontrado ou sem estoque.');return}
   consumeProductStock(p,1,{orderId:o.id});o.items.push({productId:p.id,name:p.name,price:p.price,qty:1,addons:[]});
 }else if(action.toLowerCase()==='adicional'){
   const idx=Number(prompt('Número do item', '1'))-1;if(!o.items[idx])return;
   const names=db.addons.filter(a=>a.active&&a.stock>0).map(a=>`${a.id}:${a.name}`).join('\\n');const aid=prompt('ID do adicional:\\n'+names);const a=db.addons.find(x=>x.id===aid);if(!a||a.stock<o.items[idx].qty)return alert('Adicional inválido/sem estoque.');o.items[idx].addons.push(a);a.stock-=o.items[idx].qty;
 }
 o.total=o.items.reduce((s,x)=>s+x.price*x.qty+(x.addons||[]).reduce((a,b)=>a+b.price*x.qty,0),0);save();render();
}

 document.getElementById('confirmRecipeAdd')?.addEventListener('click',()=>{
  let p=db.products.find(x=>x.id===window.recipeForProduct);if(!p)return;
  const idx=window.editingRecipeIdx,isEdit=Number.isInteger(idx)&&p.recipe&&idx>=0&&idx<p.recipe.length;
  const cur=isEdit?p.recipe[idx]:null;
  const kind=window.recipeDraftKind||(cur&&cur.kind==='pi'?'pi':'materia');
  let qty=Number(document.getElementById('recipeQty')?.value||1);
  if(qty<=0)return;
  let newItem=null;
  if(kind==='pi'){
   let pid=document.getElementById('recipeProductSelect')?.value;
   if(!pid||!piOptionAllowed(p.id,pid))return;
   newItem={kind:'pi',productId:pid,qty};
  }else{
   let ingId=document.getElementById('recipeIngredientSelect')?.value;
   if(!ingId)return;
   newItem={kind:'materia',ingredientId:ingId,qty};
  }
  const sameItem=r=>newItem.kind==='pi'?(r.kind==='pi'&&r.productId===newItem.productId):(r.kind!=='pi'&&r.ingredientId===newItem.ingredientId);
  if(isEdit){
   if(!p.recipe.some((r,i)=>i!==idx&&sameItem(r)))p.recipe[idx]=newItem;
  }else{
   if(!p.recipe)p.recipe=[];
   if(!p.recipe.some(sameItem))p.recipe.push(newItem);
  }
  window.editingProduct=p.id;window.recipeForProduct=null;window.editingRecipeIdx=null;window.recipeDraftKind=null;overlay='editProduct';save();render()
 });

async function submitCustomerOrder(){

 if(d.delivery==='entrega'&&(!d.address.trim()||!d.number.trim()||!d.neighborhood)){formErr='Informe endereço, número e bairro.';render();return}
 for(const x of cart){let p=db.products.find(q=>q.id===x.productId);if(!productAvailable(p)||getProductStock(p)<x.qty){formErr='Um produto ficou esgotado. Revise o carrinho.';render();return}for(const a of x.addons){let ad=db.addons.find(q=>q.id===a.id);if(!ad||!ad.active||ad.stock<a.qty*x.qty){formErr='Um adicional ficou esgotado. Revise o carrinho.';render();return}}}
 const fee=d.delivery==='entrega'?deliveryFee():0,base=cartSubtotal()+fee,total=paymentTotal(base,d.payment),nb=db.neighborhoods.find(n=>n.id===d.neighborhood);
 const orderId=genOrderId('PED-');
 cart.forEach(x=>{consumeProductStock(db.products.find(p=>p.id===x.productId),x.qty,{orderId});x.addons.forEach(a=>db.addons.find(q=>q.id===a.id).stock-=a.qty*x.qty)});
 const phoneFull=fmtPhone(d.phone);
 let o={id:orderId,createdAt:new Date().toISOString(),source:'online',customer:{name:d.name.trim(),phone:phoneFull,delivery:d.delivery,table:d.table,address:d.address,number:d.number,neighborhood:d.neighborhood,neighborhoodName:nb?.name||'',deliveryFee:fee,complement:d.complement,payment:d.payment,changeFor:d.changeFor||'',notes:d.notes},items:cart,total,status:'recebido',riderId:null,paid:false};db.orders.push(o);
 let c=findOrCreateCustomerByPhone(d.name.trim(),phoneFull);
 if(d.delivery==='entrega'&&d.address.trim()&&d.number.trim()&&d.neighborhood){
  if(d.selectedAddressId&&d.selectedAddressId!=='novo'&&customerAddresses(c).some(a=>a.id===d.selectedAddressId)){
   c.defaultAddressId=d.selectedAddressId;
  }else{
   let addr={id:id('addr'),label:d.saveAddress?'Endereço':'Último endereço usado',street:d.address.trim(),number:d.number.trim(),complement:d.complement||'',reference:'',neighborhood:d.neighborhood,neighborhoodName:nb?.name||'',neighborhoodFee:nb?.fee||0};
   c.addresses=c.addresses||[];c.addresses.push(addr);

 }
 setClientSession(c.id);
 save();window.lastOrderId=o.id;

}
function renderRelatorioVendas(){const todayStart=new Date();todayStart.setHours(0,0,0,0);const todayEnd=new Date();todayEnd.setHours(23,59,59,999);const weekStart=new Date();weekStart.setDate(weekStart.getDate()-weekStart.getDay());weekStart.setHours(0,0,0,0);const monthStart=new Date();monthStart.setDate(1);monthStart.setHours(0,0,0,0);const yearStart=new Date(new Date().getFullYear(),0,1);const calcSales=(from,to)=>db.orders.filter(o=>{const d=new Date(o.createdAt);return d>=from&&d<=to&&o.status==='concluido'}).reduce((sum,o)=>sum+(o.total||0),0);const todaySales=calcSales(todayStart,todayEnd);const weekSales=calcSales(weekStart,new Date());const monthSales=calcSales(monthStart,new Date());const yearSales=calcSales(yearStart,new Date());const formatCurr=v=>'R$ '+v.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});const formatDate=d=>d.toLocaleDateString('pt-BR');window.relVendasPeriod=window.relVendasPeriod||'dia';const periodRanges={dia:[todayStart,todayEnd],semana:[weekStart,new Date()],mes:[monthStart,new Date()],ano:[yearStart,new Date()]};const periodLabels={dia:'Hoje',semana:'Essa semana',mes:'Esse mês',ano:'Esse ano'};const pr=periodRanges[window.relVendasPeriod]||periodRanges.dia;const allConcluded=db.orders.filter(o=>o.status==='concluido');const filteredOrders=allConcluded.filter(o=>{const d=new Date(o.createdAt);return d>=pr[0]&&d<=pr[1]});const metrics=()=>{if(!filteredOrders.length)return{total:0,avg:0,max:0,min:0};const total=filteredOrders.reduce((s,o)=>s+(o.total||0),0);return{total,avg:total/filteredOrders.length,max:Math.max(...filteredOrders.map(o=>o.total||0)),min:Math.min(...filteredOrders.map(o=>o.total||0))}};const m=metrics();window._chartRelatorio=null;setTimeout(()=>{const ctx=document.getElementById('relatorioChart');if(ctx){if(window._chartRelatorio)window._chartRelatorio.destroy();const dayMap={};allConcluded.forEach(o=>{const d=new Date(o.createdAt);const key=d.toISOString().split('T')[0];dayMap[key]=(dayMap[key]||0)+(o.total||0)});const sorted=Object.keys(dayMap).sort();window._chartRelatorio=new Chart(ctx,{type:'bar',data:{labels:sorted.map(d=>new Date(d).toLocaleDateString('pt-BR',{day:'2-digit',month:'short'})),datasets:[{label:'Vendas (R$)',data:sorted.map(d=>dayMap[d]),backgroundColor:'#1a237e',borderRadius:6}]},options:{responsive:true,plugins:{legend:{display:false}},scales:{y:{beginAtZero:true,ticks:{callback:v=>'R$ '+(v/1000).toFixed(0)+'k'}}}}})}},100);return `<h2>Relatório de Vendas</h2><div class=\"report-header\"><div></div><div class=\"export-menu\"><button class=\"btn primary\" id=\"exportRelBtn\">📥 Exportar</button><div class=\"export-dropdown\" id=\"relExportMenu\"><button class=\"export-option\" id=\"expPdf\">📄 PDF</button><button class=\"export-option\" id=\"expXls\">📊 Excel</button><button class=\"export-option\" id=\"expCsv\">📋 CSV</button></div></div></div><div class=\"metrics-grid\"><div class=\"metric-card orange ${window.relVendasPeriod==='dia'?'selected':''}\" data-period=\"dia\" title=\"Ver pedidos de hoje\"><div><div class=\"metric-label\">HOJE</div><div class=\"metric-value\">${formatCurr(todaySales)}</div><div class=\"metric-date\">${formatDate(new Date())}</div></div><div class=\"metric-icon\">📈</div></div><div class=\"metric-card cyan ${window.relVendasPeriod==='semana'?'selected':''}\" data-period=\"semana\" title=\"Ver pedidos da semana\"><div><div class=\"metric-label\">ESSA SEMANA</div><div class=\"metric-value\">${formatCurr(weekSales)}</div><div class=\"metric-date\">${db.orders.filter(o=>{const d=new Date(o.createdAt);return d>=weekStart}).length} pedidos</div></div><div class=\"metric-icon\">📊</div></div><div class=\"metric-card magenta ${window.relVendasPeriod==='mes'?'selected':''}\" data-period=\"mes\" title=\"Ver pedidos do mês\"><div><div class=\"metric-label\">ESSE MÊS</div><div class=\"metric-value\">${formatCurr(monthSales)}</div><div class=\"metric-date\">${db.orders.filter(o=>{const d=new Date(o.createdAt);return d>=monthStart}).length} pedidos</div></div><div class=\"metric-icon\">💰</div></div><div class=\"metric-card green ${window.relVendasPeriod==='ano'?'selected':''}\" data-period=\"ano\" title=\"Ver pedidos do ano\"><div><div class=\"metric-label\">ESSE ANO</div><div class=\"metric-value\">${formatCurr(yearSales)}</div><div class=\"metric-date\">${yearSales===0?'0':formatCurr(m.avg)}</div></div><div class=\"metric-icon\">🎯</div></div></div><div class=\"chart-container\"><div class=\"chart-title\">Vendas por Dia (Últimos 90 dias)</div><canvas id=\"relatorioChart\" style=\"max-height:300px\"></canvas></div><div class=\"results-table\"><div style=\"padding:20px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px\"><div class=\"chart-title\">Detalhamento de Pedidos — ${periodLabels[window.relVendasPeriod]}</div><span class=\"meta\">${filteredOrders.length} pedido(s) · ${formatCurr(m.total)}</span></div><table><thead><tr><th>ID</th><th>Cliente</th><th>Data</th><th>Valor</th></tr></thead><tbody>${filteredOrders.length?filteredOrders.slice(-20).map(o=>`<tr><td><strong>${o.id}</strong></td><td>${esc(o.customer?.name||'-')}</td><td>${formatDate(new Date(o.createdAt))}</td><td>${formatCurr(o.total||0)}</td></tr>`).join(''):'<tr><td colspan=\"4\" class=\"meta\" style=\"text-align:center;padding:20px\">Nenhum pedido concluído neste período.</td></tr>'}</tbody></table></div>`}
window.addEventListener('hashchange',()=>{route=location.hash===ADMIN_ROUTE_HASH?'admin':'client';render()});load();
